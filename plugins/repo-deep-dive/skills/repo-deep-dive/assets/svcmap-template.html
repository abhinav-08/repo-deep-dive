<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Service map template. A horizontal mind-map: the root sits on the left, each level opens to the right, decisions (diamonds) open into case nodes, services get a boundary band around their subtree, and the selected node's data-flow links are drawn across the branches with animated signal dots. The inspector docks on the right (below on narrow screens). All repo-specific content lives in the data block: CFG, D, N, EXTRA, FX. Do not edit this shell per repo; edit the data. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f7f9fb; --ink:#151c24; --muted:#5a6573; --line:#cdd5de; --wire:#a9b4c1; --grid:#e2e7ec;
  --svc:#2453a6; --stage:#1f6f63; --step:#5b6472; --decide:#a85a07; --store:#6d3fb0; --ext:#2e7a9a; --warn:#b42318; --system:#151c24; --ok:#2f7d32;
  --flowin:#6d3fb0; --flowout:#c26a00; --call:#0b7a75;
  --chip:#e4e9ef; --sel:#fff8e6; --codebg:#f5f7f9; --casebg:#fff8ef; --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px -10px rgba(16,24,40,.22);
  --shadow-lift:0 2px 4px rgba(16,24,40,.08),0 14px 28px -14px rgba(16,24,40,.34);
  --r:11px;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1016; --panel:#141b24; --panel2:#111823; --ink:#e1e7ee; --muted:#95a2b2; --line:#263140; --wire:#3f4d5f; --grid:#141c26;
  --svc:#7ea7f2; --stage:#55bfac; --step:#aab4c1; --decide:#f0a24a; --store:#b892f5; --ext:#6cc0e0; --warn:#ff7a6b; --system:#e1e7ee; --ok:#7cc47f;
  --flowin:#b892f5; --flowout:#f0a24a; --call:#4fd1c5;
  --chip:#1d2632; --sel:#2a2515; --codebg:#0e151d; --casebg:#1f1a12; --onaccent:#0b1016;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 32px -14px rgba(0,0,0,.8);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1016; --panel:#141b24; --panel2:#111823; --ink:#e1e7ee; --muted:#95a2b2; --line:#263140; --wire:#3f4d5f; --grid:#141c26;
  --svc:#7ea7f2; --stage:#55bfac; --step:#aab4c1; --decide:#f0a24a; --store:#b892f5; --ext:#6cc0e0; --warn:#ff7a6b; --system:#e1e7ee; --ok:#7cc47f;
  --flowin:#b892f5; --flowout:#f0a24a; --call:#4fd1c5;
  --chip:#1d2632; --sel:#2a2515; --codebg:#0e151d; --casebg:#1f1a12; --onaccent:#0b1016;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 32px -14px rgba(0,0,0,.8);
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1680px;margin:0 auto;display:grid;gap:12px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.01em}
.lede{color:var(--muted);max-width:95ch;margin:4px 0 0}
.lbl{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 12px}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--svc)}
.btn[aria-pressed="true"]{background:var(--svc);color:var(--onaccent);border-color:var(--svc)}
.btn svg{width:14px;height:14px;flex:none}
.btn .kb{font:600 10px/1 var(--f-mono);opacity:.6;border:1px solid currentColor;border-radius:3px;padding:2px 3px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:2px;gap:2px}
.seg .btn{border:0;background:none;border-radius:7px;padding:5px 12px}
.seg .btn[aria-pressed="true"]{background:var(--svc);color:var(--onaccent)}
.search{position:relative;display:inline-flex;align-items:center}
.search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--muted);pointer-events:none}
input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px 6px 28px;width:240px;max-width:100%;font-size:14px}
:focus-visible{outline:2px solid var(--decide);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.mk{width:12px;height:12px;display:inline-block;flex:none;border-radius:3px}
.mk.system{background:var(--system)} .mk.service{background:var(--svc)} .mk.stage{background:var(--stage)} .mk.step{background:var(--step)}
.mk.decision{background:var(--decide);transform:rotate(45deg) scale(.82);border-radius:1px}
.mk.store{background:var(--store);border-radius:50%/30%} .mk.external{background:transparent;border:2.5px solid var(--ext)}
.mk.case{background:var(--casebg);border:2px dashed var(--decide)}
.ln{width:22px;height:0;border-top:2px dashed;display:inline-block}
.ln.in{border-color:var(--flowin)} .ln.out{border-color:var(--flowout)}
.bnk{width:16px;height:11px;display:inline-block;border:1.5px dashed color-mix(in srgb,var(--svc) 45%,transparent);border-radius:4px;background:color-mix(in srgb,var(--svc) 8%,transparent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:14px;align-items:start}
@media (max-width:1150px){.layout{grid-template-columns:1fr}}

/* ---------- canvas ---------- */
.mapstage{position:relative;height:min(80vh,900px);min-height:460px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;box-shadow:var(--shadow);
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
.mapstage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;-webkit-user-select:none;user-select:none}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* boundary band drawn behind a service's subtree */
.bnd rect{fill:color-mix(in srgb,var(--svc) 6%,transparent);stroke:color-mix(in srgb,var(--svc) 30%,transparent);stroke-width:1.2;stroke-dasharray:5 6}
.bnd .bl{font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;fill:var(--svc);opacity:.85}
.bnd .bp{fill:color-mix(in srgb,var(--svc) 12%,var(--panel));stroke:color-mix(in srgb,var(--svc) 28%,transparent);stroke-width:1}

.wire{fill:none;stroke:var(--wire);stroke-width:1.6}
.wire.cw{stroke-dasharray:3 4;stroke:var(--decide);opacity:.6}
.wire.act{stroke:color-mix(in srgb,var(--svc) 70%,var(--wire));stroke-width:2.2}
@keyframes routemove{to{stroke-dashoffset:-30}}
body.motion .wire.act{stroke-dasharray:16 6;animation:routemove 1.6s linear infinite}
.flow{fill:none;stroke-width:2.2;stroke-dasharray:7 6;stroke-linecap:round}
.flow.in{stroke:var(--flowin)} .flow.out{stroke:var(--flowout)}
@keyframes flowmove{to{stroke-dashoffset:-52}}
body.motion .flow{animation:flowmove 1.15s linear infinite}
.sig{r:3.4}
.sig.in{fill:var(--flowin)} .sig.out{fill:var(--flowout)}
.sigh{fill:none;stroke-width:1.2;opacity:.35}
.sigh.in{stroke:var(--flowin)} .sigh.out{stroke:var(--flowout)}
.flbl rect{stroke-width:1.1}
.flbl text{font:600 10.5px var(--f-mono);dominant-baseline:middle}
.flbl.in rect{fill:color-mix(in srgb,var(--flowin) 10%,var(--panel));stroke:color-mix(in srgb,var(--flowin) 45%,transparent)}
.flbl.in text{fill:var(--flowin)}
.flbl.out rect{fill:color-mix(in srgb,var(--flowout) 10%,var(--panel));stroke:color-mix(in srgb,var(--flowout) 45%,transparent)}
.flbl.out text{fill:var(--flowout)}
.arw{fill:var(--wire)} .arw.in{fill:var(--flowin)} .arw.out{fill:var(--flowout)}
@media (prefers-reduced-motion:reduce){body.motion .flow,body.motion .wire.act{animation:none}}

/* ---------- node cards ---------- */
@media (prefers-reduced-motion:no-preference){.nd{transition:left .26s cubic-bezier(.22,.61,.36,1),top .26s cubic-bezier(.22,.61,.36,1),opacity .2s,box-shadow .18s,border-color .18s}}
.nd{position:absolute;width:252px;height:76px;display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);--k:var(--step)}
.nd:hover{box-shadow:var(--shadow-lift);border-color:color-mix(in srgb,var(--k) 45%,var(--line))}
.nd .stripe{width:4px;border-radius:calc(var(--r) - 1px) 0 0 calc(var(--r) - 1px);flex:none;background:var(--k);opacity:.9}
.nd.k-system{--k:var(--system)} .nd.k-service{--k:var(--svc)} .nd.k-stage{--k:var(--stage)}
.nd.k-step{--k:var(--step)} .nd.k-decision{--k:var(--decide)} .nd.k-store{--k:var(--store)} .nd.k-external{--k:var(--ext)} .nd.k-case{--k:var(--decide)}
.nd.k-system{background:linear-gradient(180deg,color-mix(in srgb,var(--system) 6%,var(--panel)),var(--panel))}
.nd.k-service{background:linear-gradient(180deg,color-mix(in srgb,var(--svc) 7%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--svc) 30%,var(--line))}
.nd.k-store{background:linear-gradient(180deg,color-mix(in srgb,var(--store) 6%,var(--panel)),var(--panel))}
.nd.k-external{background:linear-gradient(180deg,color-mix(in srgb,var(--ext) 6%,var(--panel)),var(--panel));border-style:dashed}
.nd.k-case{background:var(--casebg);border:1.5px dashed color-mix(in srgb,var(--decide) 60%,var(--line));box-shadow:none}
.nd.k-case .stripe{display:none}
.nd.k-case .t{font:600 12px/1.25 var(--f-mono);color:var(--decide)}
.nd.k-case .ico{width:22px;height:22px;background:transparent;border-color:transparent;opacity:.7}

.nd .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:7px 10px 7px 8px;cursor:pointer;border-radius:0 var(--r) var(--r) 0;
  display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:auto auto auto;align-content:center;gap:1px 9px}
.nd.hastg .body{padding-right:19px}   /* the toggle overlaps the card edge; keep the kind label clear of it */
.nd .ico{grid-column:1;grid-row:1/4;align-self:center;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent);border:1px solid color-mix(in srgb,var(--k) 26%,transparent)}
.nd .ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nd .hd{grid-column:2;display:flex;gap:7px;align-items:baseline;min-width:0}
.nd .t{flex:1 1 auto;min-width:0;display:block;font:700 13.5px/1.3 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .kc{flex:none;font:600 9px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--k);opacity:.78}
.nd.k-service .t{color:var(--svc)} .nd.k-system .t{font-size:15px}
.nd .s{grid-column:2;display:block;font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .meta{grid-column:2;display:flex;gap:4px;margin-top:3px;overflow:hidden}
.pill{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.pill.w{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.call{background:color-mix(in srgb,var(--call) 15%,transparent);color:var(--call);border-color:color-mix(in srgb,var(--call) 42%,transparent)}
.pill.fx{background:color-mix(in srgb,var(--decide) 16%,transparent);color:var(--decide);border-color:color-mix(in srgb,var(--decide) 42%,transparent)}
.pill.if{background:transparent;color:var(--decide);border-color:color-mix(in srgb,var(--decide) 45%,transparent)}
.pill.io{background:transparent;border-color:var(--line)}

/* decision diamond */
.nd.k-decision{height:104px;background:transparent;border:0;box-shadow:none;border-radius:0}
.nd.k-decision .stripe,.nd.k-decision .ico,.nd.k-decision .s{display:none}
.dshape{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dshape polygon{fill:var(--panel);stroke:color-mix(in srgb,var(--decide) 75%,var(--line));stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;
  filter:drop-shadow(0 6px 14px rgba(16,24,40,.18))}
:root[data-theme="dark"] .dshape polygon,:root:not([data-theme="light"]) .dshape polygon{filter:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .dshape polygon{filter:drop-shadow(0 6px 14px rgba(16,24,40,.18))}}
.nd.k-decision .body{position:relative;z-index:1;padding:0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.nd.k-decision .hd{flex-direction:column;align-items:center;gap:2px}
.nd.k-decision .t{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:1.2;flex:none}
.nd.k-decision .kc{display:none}
.nd.k-decision .meta{justify-content:center;margin-top:0}
.nd.k-decision .body:focus-visible{outline:none}
.nd.k-decision:hover .dshape polygon{stroke:var(--decide);stroke-width:2.4}

/* toggle, selection, trace */
.nd .tg{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--wire);background:var(--panel);font:600 11px/1 var(--f-mono);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2;box-shadow:var(--shadow)}
.nd .tg:hover{border-color:var(--k);color:var(--k)}
.nd .tg.open{color:var(--ink);border-color:var(--ink)}
.nd .tg.cases{border-style:dashed;border-color:var(--decide);color:var(--decide)}
.nd.sel{border-color:var(--decide);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--decide) 55%,transparent),var(--shadow-lift);background:var(--sel)}
.nd.fin{box-shadow:0 0 0 2px var(--flowin),var(--shadow)} .nd.fout{box-shadow:0 0 0 2px var(--flowout),var(--shadow)}
.nd.hit{box-shadow:0 0 0 2.5px var(--store),var(--shadow)}
.nd.up{border-color:color-mix(in srgb,var(--flowin) 60%,var(--line))}
.nd.down{border-color:color-mix(in srgb,var(--flowout) 60%,var(--line))}
.nd.dim{opacity:.26;filter:saturate(.3)}
.nd .tr{position:absolute;left:-7px;top:-7px;font:700 8.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:999px;color:var(--onaccent);z-index:3}
.nd.up .tr{background:var(--flowin)} .nd.down .tr{background:var(--flowout)}
.nd.k-decision.sel,.nd.k-decision.fin,.nd.k-decision.fout,.nd.k-decision.hit{box-shadow:none;background:transparent}
.nd.k-decision.sel .dshape polygon{fill:var(--sel);stroke:var(--decide);stroke-width:3}
.nd.k-decision.fin .dshape polygon{stroke:var(--flowin);stroke-width:2.6}
.nd.k-decision.fout .dshape polygon{stroke:var(--flowout);stroke-width:2.6}
.nd.k-decision.hit .dshape polygon{stroke:var(--store);stroke-width:3}
.nd.k-decision:has(.body:focus-visible) .dshape polygon{stroke:var(--decide);stroke-width:3;stroke-dasharray:5 3}

/* canvas chrome */
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:5;background:var(--panel);padding:4px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.zoombar .btn{padding:6px 12px;font:600 15px var(--f-mono);min-width:40px;border:0}
.zoombar .zl{min-width:66px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);z-index:5;background:color-mix(in srgb,var(--panel) 88%,transparent);padding:4px 9px;border-radius:7px;border:1px solid var(--line);backdrop-filter:blur(4px)}
.hint kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:1px 4px;background:var(--codebg)}
.mini{position:absolute;right:10px;top:10px;width:188px;height:124px;z-index:5;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;cursor:pointer;backdrop-filter:blur(4px)}
.mini svg{width:100%;height:100%;display:block}
.mini .mn{opacity:.5}
.mini .mn.k-system{fill:var(--system)} .mini .mn.k-service{fill:var(--svc)} .mini .mn.k-stage{fill:var(--stage)}
.mini .mn.k-step{fill:var(--step)} .mini .mn.k-decision{fill:var(--decide)} .mini .mn.k-store{fill:var(--store)}
.mini .mn.k-external{fill:var(--ext)} .mini .mn.k-case{fill:var(--decide);opacity:.3}
.mini .mn.sel{opacity:1;stroke:var(--decide);stroke-width:14}
.mini .vp{fill:color-mix(in srgb,var(--svc) 10%,transparent);stroke:var(--svc);stroke-width:10}

/* ---------- inspector ---------- */
.insp{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 16px 16px;display:grid;gap:15px;min-width:0;box-shadow:var(--shadow);align-content:start}
@media (max-width:1150px){.insp{position:static;max-height:none}}
.ihead{position:sticky;top:0;z-index:4;background:linear-gradient(180deg,var(--panel) 72%,transparent);padding:14px 0 8px;display:grid;gap:7px;margin:0 -16px;padding-left:16px;padding-right:16px}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.crumbs button{background:none;border:0;padding:0;color:var(--svc);cursor:pointer;font:inherit}
.crumbs button:hover{text-decoration:underline}
.insp h2{font-size:21px}
.kindtag{font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--k,var(--step)) 14%,transparent);color:var(--k,var(--step));border:1px solid color-mix(in srgb,var(--k,var(--step)) 30%,transparent)}
.insp[data-k="system"]{--k:var(--system)} .insp[data-k="service"]{--k:var(--svc)} .insp[data-k="stage"]{--k:var(--stage)}
.insp[data-k="step"]{--k:var(--step)} .insp[data-k="decision"]{--k:var(--decide)} .insp[data-k="store"]{--k:var(--store)}
.insp[data-k="external"]{--k:var(--ext)} .insp[data-k="case"]{--k:var(--decide)}
.desc{margin:0;max-width:72ch}
.sec{display:grid;gap:7px;min-width:0}
.sec>h3{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:7px;align-items:center}
.sec>h3::before{content:"";width:3px;height:12px;border-radius:2px;background:color-mix(in srgb,var(--k,var(--step)) 60%,transparent);flex:none}
ol.steps{margin:0;padding-left:20px;display:grid;gap:5px}
.io{display:grid;gap:6px}
.item{border:1px solid var(--line);border-radius:9px;background:var(--panel2);min-width:0}
.item summary{cursor:pointer;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"▸";color:var(--muted);font-size:12px}
.item[open] summary::before{content:"▾"}
.dn{font:600 13px var(--f-mono);color:var(--store)}
.dd{color:var(--muted);font-size:13.5px}
.links{padding:0 10px 10px;display:grid;gap:6px;font-size:13.5px}
.links b{font-weight:600}
.lk{background:none;border:0;padding:0;color:var(--svc);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px;text-align:left}
.reach{display:flex;flex-wrap:wrap;gap:6px}
.rch{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.rch b{font:600 12px var(--f-mono)}
.rch.u{border-color:color-mix(in srgb,var(--flowin) 45%,transparent);color:var(--flowin)}
.rch.d{border-color:color-mix(in srgb,var(--flowout) 45%,transparent);color:var(--flowout)}
pre{margin:0;background:var(--codebg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12px/1.55 var(--f-mono);color:var(--ink)}
pre .kw{color:var(--decide);font-weight:600} pre .cm{color:var(--muted);font-style:italic}
.casebtn{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.25fr);gap:8px;font-size:13.5px;padding:9px 10px;border-radius:8px;background:var(--casebg);border:1px dashed color-mix(in srgb,var(--decide) 45%,var(--line));text-align:left;cursor:pointer;width:100%}
.casebtn:hover{border-style:solid}
.casebtn .c{font-family:var(--f-mono);font-size:12px;color:var(--decide);overflow-wrap:anywhere;min-width:0}
.casebtn .a{color:var(--muted)} .casebtn .r{min-width:0}
.casebtn .x{grid-column:1/-1;color:var(--muted);font-size:13px;border-top:1px dotted var(--line);padding-top:5px}
.casebtn.cur{outline:2px solid var(--decide)}
.callcard{border:1px solid color-mix(in srgb,var(--call) 48%,var(--line));border-radius:10px;padding:11px 13px;display:grid;gap:9px;background:color-mix(in srgb,var(--call) 6%,var(--panel))}
.callcard .callh{display:flex;gap:8px;align-items:center}
.calltag{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--onaccent);background:var(--call);padding:3px 8px;border-radius:999px}
.callcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin:0;font-size:13.5px}
.callcard dt{color:var(--muted);font-weight:600} .callcard dd{margin:0;overflow-wrap:anywhere}
.callcard h4{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.callcard p{margin:0;font-size:13.5px}
.fxcard{border:1px solid color-mix(in srgb,var(--decide) 40%,var(--line));border-radius:10px;padding:13px;display:grid;gap:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--decide) 4%,var(--panel)),var(--panel));min-width:0}
.fxcard .fxh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fxtag{font:700 12px var(--f-mono);color:var(--onaccent);background:var(--decide);padding:3px 8px;border-radius:999px}
.fxcard h4{font-size:15px}
.fxcard .fxd{margin:0;font-size:13.5px;color:var(--muted)}
.fxin{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px 12px}
.fxin label{display:grid;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.fxin label.ck{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.fxin label.wide{grid-column:1/-1}
.fxin input[type=text],.fxin input[type=number],.fxin select{border:1px solid var(--line);background:var(--codebg);border-radius:6px;padding:6px 8px;font-size:13.5px;width:100%;min-width:0}
.fxin input[type=range]{width:100%;accent-color:var(--decide)}
.rv{font:600 12px var(--f-mono);color:var(--ink)}
table.fxout{border-collapse:collapse;width:100%;font-size:13.5px}
table.fxout th{text-align:left;font-weight:400;color:var(--muted);padding:4px 8px 4px 0;vertical-align:top;width:46%}
table.fxout td{padding:4px 0;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
table.fxout td.mono{font:500 12px var(--f-mono)}
table.fxout td.ok{color:var(--ok)} table.fxout td.warn{color:var(--decide)} table.fxout td.bad{color:var(--warn)}
table.mini2{border-collapse:collapse;font:12px var(--f-mono);margin-top:4px}
table.mini2 th{color:var(--muted);font-weight:400;padding:3px 8px 3px 0;text-align:left}
table.mini2 td{border:1px solid var(--line);padding:3px 7px;text-align:center}
table.mini2 td.hl{background:var(--decide);color:var(--onaccent)}
.fxsvg{width:100%;height:auto;display:block}
.fxsvg .curve{fill:none;stroke:var(--decide);stroke-width:2}
.fxsvg .guide{stroke:var(--line);stroke-dasharray:3 3}
.fxsvg .dot{fill:var(--svc)}
.fxsvg .axl,.fxsvg .segl{font:11px var(--f-mono);fill:var(--muted)}
.fxsvg .seg.good{fill:var(--ok)} .fxsvg .seg.bad{fill:var(--warn)} .fxsvg .seg.wait{fill:var(--line)}
.trace{margin:0;padding-left:18px;font:12.5px/1.5 var(--f-mono);color:var(--ink)}
.fxnote{margin:0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.ev{font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere;display:grid;gap:4px}
.ev button{font:inherit;color:var(--muted);background:var(--codebg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;cursor:pointer;text-align:left}
.ev button:hover{color:var(--ink);border-color:var(--svc)}
.conf{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted)}
.note{border-left:3px solid var(--warn);padding:8px 11px;background:color-mix(in srgb,var(--warn) 7%,var(--panel2));border-radius:0 8px 8px 0;font-size:14px}
.calls{display:grid;gap:7px}
.call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:14px;align-items:baseline}
.call .to{font-weight:600}
.lineage{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,2fr);gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px}
.lrow .h{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
.usedat{font-size:13px;color:var(--muted)}
@media (max-width:700px){.lrow{grid-template-columns:1fr}.casebtn{grid-template-columns:1fr}.casebtn .a{display:none}.mini,#miniBtn{display:none}}
.foot{color:var(--muted);font-size:13px;max-width:95ch}
</style>

<div class="wrap">
  <header>
    <div class="lbl" id="kicker"></div>
    <h1 id="ttl"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button class="btn" id="vTree" aria-pressed="true">Map</button>
      <button class="btn" id="vFx" aria-pressed="false">Formulas</button>
      <button class="btn" id="vLin" aria-pressed="false">Data lineage</button>
    </div>
    <span class="grow"></span>
    <button class="btn" id="flowBtn" aria-pressed="true" title="Draw the selected node's data-flow links">Data flow</button>
    <button class="btn" id="traceBtn" aria-pressed="false" title="Dim everything but what feeds the selected node and what it feeds (R)">Trace <span class="kb">R</span></button>
    <button class="btn" id="motionBtn" aria-pressed="true" title="Animate the flow lines">Motion</button>
    <button class="btn" id="miniBtn" aria-pressed="true" title="Minimap (M)">Minimap <span class="kb">M</span></button>
    <button class="btn" id="expAll">Expand all</button>
    <button class="btn" id="colAll">Services only</button>
    <button class="btn" id="themeBtn" title="Light / dark (T)">Theme <span class="kb">T</span></button>
    <label class="lbl" for="q">Find</label>
    <span class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input type="search" id="q" placeholder="Find…"></span>
  </div>
  <div class="legend" id="legend"></div>

  <div id="main"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
/* ======================= HELPERS (usable from the data block) ======================= */
const L=String.raw;                       // L`...` keeps backslashes (regexes, paths) in logic blocks; ${} still interpolates
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(x,d=3)=>{ if(!isFinite(x)) return String(x); if(Math.abs(x)>=1000) return Math.round(x).toLocaleString("en-US");
  let s=(+x).toFixed(d); if(s.includes(".")) s=s.replace(/0+$/,"").replace(/\.$/,""); return s; };   // never strips integer zeros
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
// Timeline: segs [{a,b,label,cls:"good"|"bad"|"wait"}] on 0..total
function bars(segs,total,unit="ms",aria="Timeline"){
  const W=420,H=18*segs.length+26, sx=x=>12+(W-24)*x/total; let g="";
  segs.forEach((s,i)=>{ const y=8+i*18; const right=sx(s.b)+4+s.label.length*6.6<=W+4;
    g+=`<rect x="${sx(s.a)}" y="${y}" width="${Math.max(2,sx(s.b)-sx(s.a))}" height="12" rx="3" class="seg ${s.cls}"/><text x="${right?sx(s.b)+4:sx(s.a)-4}" y="${y+10}" class="segl" text-anchor="${right?"start":"end"}">${esc(s.label)}</text>`; });
  for(let i=0;i<=4;i++){ const t=total*i/4; g+=`<text x="${sx(t)}" y="${H-4}" class="axl" text-anchor="${i===0?"start":i===4?"end":"middle"}">${fmt(Math.round(t),0)} ${unit}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="fxsvg" role="img" aria-label="${esc(aria)}">${g}</svg>`; }
// Curve of y=f(x) on [lo,hi] with an optional marker at x and labelled vertical guides.
// plot({f, lo, hi, x, guides:[{x,label}], ylo, yhi, xl:"unit", aria})
function plot(o){
  const W=420,H=130,lo=o.lo,hi=o.hi,n=o.n||80,pts=[];
  for(let i=0;i<=n;i++){ const x=lo+(hi-lo)*i/n; pts.push([x,o.f(x)]); }
  const ylo=o.ylo??Math.min(0,...pts.map(p=>p[1])), yhi=o.yhi??Math.max(...pts.map(p=>p[1]));
  const sx=x=>10+(W-20)*(x-lo)/((hi-lo)||1), sy=y=>H-22-(H-36)*(y-ylo)/((yhi-ylo)||1);
  let g=`<path d="${pts.map((p,i)=>(i?"L":"M")+sx(p[0]).toFixed(1)+","+sy(p[1]).toFixed(1)).join("")}" class="curve"/>`;
  (o.guides||[]).forEach(q=>{ g+=`<line x1="${sx(q.x)}" x2="${sx(q.x)}" y1="${sy(ylo)}" y2="${sy(yhi)}" class="guide"/>${q.label?`<text x="${sx(q.x)+4}" y="24" class="axl">${esc(q.label)}</text>`:""}`; });
  if(o.x!==undefined){ const px=clamp(o.x,lo,hi); g+=`<circle cx="${sx(px)}" cy="${sy(o.f(px))}" r="4" class="dot"/>`; }
  g+=`<text x="${sx(lo)}" y="${H-4}" class="axl">${fmt(lo)}${o.xl?" "+esc(o.xl):""}</text><text x="${sx(hi)}" y="${H-4}" class="axl" text-anchor="end">${fmt(hi)}</text><text x="12" y="12" class="axl">${fmt(yhi)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="fxsvg" role="img" aria-label="${esc(o.aria||"Function plot")}">${g}</svg>`; }

/* ======================= DATA BLOCK =======================
   Must declare: CFG, D, N, EXTRA, FX (use {} when empty). Do not redeclare the helpers above. */
/*__DATA__*/

/* ======================= INDEX ======================= */
const byId={}, parentOf={}, producers={}, consumers={};
(function walk(n,p){
  const x=EXTRA[n.id]; if(x){ if(x.patch) Object.assign(n,x.patch); ["what","logic","ext","es","fx","brx","warn","uses","ev","c"].forEach(k=>{ if(x[k]!==undefined) n[k]=x[k]; }); }
  if(n.es&&!n.ext) n.ext={sys:"Elasticsearch",tag:"ES",...n.es};      // older data used es:{...}
  if(n.ext&&!Array.isArray(n.ext)) n.ext=[n.ext];
  if(n.br && !(n.kids&&n.kids.length)){ n.cases=true; n.kids=n.br.map((b,i)=>({id:n.id+"__c"+i,k:"case",t:b[0],s:b[1],caseOf:n.id,ci:i,x:(n.brx||[])[i]})); }
  byId[n.id]=n; if(p) parentOf[n.id]=p.id;
  (n.out||[]).forEach(x=>(producers[x]=producers[x]||[]).push(n.id));
  (n.in||[]).forEach(x=>(consumers[x]=consumers[x]||[]).push(n.id));
  (n.kids||[]).forEach(k=>walk(k,n)); })(N,null);
const usedAt={}; Object.values(byId).forEach(n=>(n.fx||[]).forEach(f=>(usedAt[f]=usedAt[f]||[]).push(n.id)));

const ROOT=N.id, SKEY=(CFG.key||"svcmap")+".sel", TKEY=(CFG.key||"svcmap")+".theme";
const REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const st={open:new Set(CFG.open||[ROOT]),sel:(CFG.sel&&byId[CFG.sel])?CFG.sel:ROOT,view:"map",q:"",flow:true,trace:false,
  motion:CFG.motion!==false&&!REDUCE,mini:CFG.mini!==false,tx:24,ty:24,k:0.85};
try{const s=localStorage.getItem(SKEY); if(s&&byId[s]) st.sel=s;}catch(e){}
try{const t=localStorage.getItem(TKEY); if(t==="dark"||t==="light") document.documentElement.dataset.theme=t;}catch(e){}
const W=252,H=76,HD=104,CG=84,RG=14,SG=30;   // SG: extra air between service subtrees so their boundary bands never touch
const hOf=n=>n.k==="decision"?HD:H;            // decisions are drawn as taller diamonds
const KIND={system:"System",service:"Service",stage:"Stage",step:"Step",decision:"Decision",store:"Data store",external:"External call",case:"Case"};

/* kind glyphs: 16x16, stroked with currentColor (set to the kind accent by .ico) */
const ICON={
 system:'<rect x="2.2" y="2.2" width="5" height="5" rx="1.2"/><rect x="8.8" y="2.2" width="5" height="5" rx="1.2"/><rect x="2.2" y="8.8" width="5" height="5" rx="1.2"/><rect x="8.8" y="8.8" width="5" height="5" rx="1.2"/>',
 service:'<path d="M8 1.8 14.2 5 8 8.2 1.8 5z"/><path d="M1.8 8.1 8 11.3l6.2-3.2"/><path d="M1.8 11.2 8 14.4l6.2-3.2"/>',
 stage:'<path d="M3.4 2v12.2"/><path d="M3.4 2.9h9.3l-2 3 2 3H3.4"/>',
 step:'<circle cx="8" cy="8" r="5.6"/><path d="M6.6 5.5 10.2 8l-3.6 2.5z"/>',
 decision:'<path d="M8 1.7 14.3 8 8 14.3 1.7 8z"/>',
 store:'<ellipse cx="8" cy="4.1" rx="5.4" ry="2.3"/><path d="M2.6 4.1v7.8c0 1.3 2.4 2.3 5.4 2.3s5.4-1 5.4-2.3V4.1"/><path d="M2.6 8.2c0 1.3 2.4 2.3 5.4 2.3s5.4-1 5.4-2.3"/>',
 external:'<circle cx="8" cy="8" r="5.9"/><path d="M2.2 8h11.6"/><path d="M8 2.1c2.3 2.6 2.3 9.2 0 11.8"/><path d="M8 2.1C5.7 4.7 5.7 11.3 8 13.9"/>',
 "case":'<path d="M4 2v11.8"/><path d="M4 6.6h4.6a3 3 0 0 1 3 3v4.2"/>'};
const ico=k=>`<span class="ico" aria-hidden="true"><svg viewBox="0 0 16 16">${ICON[k]||ICON.step}</svg></span>`;

function ancestors(id){const a=[];let p=parentOf[id];while(p){a.unshift(p);p=parentOf[p];}return a;}
function descendants(n,acc=[]){(n.kids||[]).forEach(k=>{acc.push(k.id);descendants(k,acc);});return acc;}
function nodeText(n){return [n.t,n.s,n.d,n.uses,n.warn,n.logic,(n.what||[]).join(" "),n.ext?JSON.stringify(n.ext):"",(n.fx||[]).map(f=>FX[f]?FX[f].t:"").join(" "),(n.in||[]).join(" "),(n.out||[]).map(o=>o+" "+(D[o]?D[o].n:"")).join(" "),(n.br||[]).map(b=>b.join(" ")).join(" ")].join(" ").toLowerCase();}
function repOf(id){ const chain=[...ancestors(id),id]; let rep=ROOT;
  for(const a of chain){ if(a===ROOT){rep=ROOT;continue;} if(st.open.has(parentOf[a])) rep=a; else break; } return rep; }

/* ---------- layout ---------- */
let POS={};
function layout(){
  POS={}; let y=0; const order=[];
  (function place(n,d){
    const h=hOf(n), x=d*(W+CG), kids=(n.kids&&st.open.has(n.id))?n.kids:[];
    if(!kids.length){ POS[n.id]={x,y,h}; order.push(n.id); y+=h+RG; return; }
    const startY=y, from=order.length;
    kids.forEach(k=>place(k,d+1));
    const f=POS[kids[0].id], l=POS[kids[kids.length-1].id];
    let top=(f.y+f.h/2+l.y+l.h/2)/2-h/2;                       // centre the parent on its children
    if(top<startY){ const dy=startY-top; order.slice(from).forEach(id=>POS[id].y+=dy); y+=dy; top=startY; }  // tall parent, short children
    POS[n.id]={x,y:top,h}; order.push(n.id); y=Math.max(y,top+h+RG)+(n.k==="service"?SG:0);   // services get their own band, so keep them apart
  })(N,0);
  return y;
}

/* ---------- flow and reach ---------- */
function flowEdges(){
  const n=byId[st.sel]; if(!n||!st.flow) return [];
  const E=[], seen=new Set(), me=repOf(n.id);
  (n.in||[]).forEach(d=>(producers[d]||[]).forEach(p=>{ if(p===n.id) return; const a=repOf(p); if(a===me) return; const key="i"+a+d; if(seen.has(key)) return; seen.add(key); E.push({from:a,to:me,d,dir:"in"}); }));
  (n.out||[]).forEach(d=>(consumers[d]||[]).forEach(c=>{ if(c===n.id) return; const b=repOf(c); if(b===me) return; const key="o"+b+d; if(seen.has(key)) return; seen.add(key); E.push({from:me,to:b,d,dir:"out"}); }));
  const M={}; E.forEach(e=>{const k=e.dir+e.from+">"+e.to; (M[k]=M[k]||{...e,ds:[]}).ds.push(D[e.d]?D[e.d].n:e.d);});
  return Object.values(M);
}
// Transitive reach through the data graph: who ultimately feeds this node, and who ultimately consumes it.
function reachOf(id){
  const up=new Set(), dn=new Set();
  for(const q=[id];q.length;){ const c=q.pop();
    (byId[c].in||[]).forEach(d=>(producers[d]||[]).forEach(p=>{ if(p!==id&&!up.has(p)){ up.add(p); q.push(p); } })); }
  for(const q=[id];q.length;){ const c=q.pop();
    (byId[c].out||[]).forEach(d=>(consumers[d]||[]).forEach(x=>{ if(x!==id&&!dn.has(x)){ dn.add(x); q.push(x); } })); }
  return {up,dn};
}
function curve(a,b){
  const x1=a.x+W, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
  if(x2>x1+10){ const m=(x1+x2)/2; return {p:`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`, mx:m, my:(y1+y2)/2}; }
  const r=Math.max(x1,b.x+W)+60, l=Math.min(a.x,x2)-60;
  return {p:`M${x1},${y1} C${r},${y1} ${r},${(y1+y2)/2} ${(x1+x2)/2},${(y1+y2)/2} S${l},${y2} ${x2},${y2}`, mx:(x1+x2)/2, my:(y1+y2)/2};
}

/* ---------- formula widgets ---------- */
const FXSTATE={};
function fxState(id){ return FXSTATE[id]||(FXSTATE[id]=Object.fromEntries(FX[id].inp.map(i=>[i.id,i.v]))); }
function fxCard(id){
  const f=FX[id]; if(!f) return ""; const s=fxState(id);
  const inputs=f.inp.map(i=>{ const v=s[i.id]; const a=`data-fx="${id}" data-in="${i.id}" id="fx-${id}-${i.id}"`;
    if(i.type==="check") return `<label class="ck"><input type="checkbox" ${a} ${v?"checked":""}>${esc(i.label)}</label>`;
    if(i.type==="select") return `<label>${esc(i.label)}<select ${a}>${i.opts.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label>`;
    if(i.type==="range") return `<label class="wide">${esc(i.label)} <span class="rv" data-rv="${id}-${i.id}">${esc(v)}</span><input type="range" ${a} min="${i.min}" max="${i.max}" step="${i.step}" value="${esc(v)}"></label>`;
    if(i.type==="num") return `<label>${esc(i.label)}<input type="number" ${a} value="${esc(v)}" step="any"></label>`;
    return `<label class="wide">${esc(i.label)}<input type="text" ${a} value="${esc(v)}"></label>`; }).join("");
  const used=(usedAt[id]||[]).map(n=>`<button class="lk" data-go="${n}">${esc(byId[n].t)}</button>`).join(", ");
  return `<div class="fxcard"><div class="fxh"><span class="fxtag">ƒ</span><h4>${esc(f.t)}</h4><span class="conf">${esc(f.conf)}</span></div>
    <p class="fxd">${esc(f.d)}</p><div class="fxin">${inputs}</div><div data-fxout="${id}"></div>${st.view==="fx"&&used?`<div class="usedat">Used at: ${used}</div>`:""}</div>`;
}
function fxRender(id,res){

function applyTx(){ worldEl.style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.k})`;
  const z=document.getElementById("zReset"), zi=document.getElementById("zIn"), zo=document.getElementById("zOut");
  if(z) z.textContent=Math.round(st.k*100)+"%"; if(zi) zi.disabled=st.k>=2.2-1e-9; if(zo) zo.disabled=st.k<=0.2+1e-9; syncMini(); }

  const t0=performance.now(), DUR=260;
  (function step(now){ const p=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-p,3);
    set(k0*Math.pow(k1/k0,e), cx+(ex-cx)*e, cy+(ey-cy)*e);
    if(p<1) requestAnimationFrame(step); })(t0);
}
function fit(){ const xs=Object.values(POS); if(!xs.length||!stageEl) return; const r=stageEl.getBoundingClientRect();
  const w=Math.max(...xs.map(p=>p.x))+W+40, h=Math.max(...xs.map(p=>p.y+p.h))+40;
  st.k=Math.min(1.2,Math.max(0.2,Math.min(r.width/w,r.height/h))); st.tx=(r.width-w*st.k)/2+20*st.k; st.ty=(r.height-h*st.k)/2+20*st.k; applyTx(); }
function centerOn(id){ const p=POS[id]; if(!p||!stageEl) return; const r=stageEl.getBoundingClientRect();
  const sx=st.tx+p.x*st.k, sy=st.ty+p.y*st.k;
  if(sx<20||sx+W*st.k>r.width-20||sy<20||sy+p.h*st.k>r.height-20){ st.tx=r.width*0.35-p.x*st.k; st.ty=r.height/2-(p.y+p.h/2)*st.k; applyTx(); } }
function keepAnchor(id,fn){ const before=POS[id]; fn(); const after=POS[id]; if(before&&after){ st.tx+=(before.x-after.x)*st.k; st.ty+=(before.y-after.y)*st.k; applyTx(); } }

function bindPan(){
  let drag=null;
  stageEl.addEventListener("pointerdown",e=>{ if(e.target.closest("button,.zoombar,.mini")) return; drag={x:e.clientX,y:e.clientY,tx:st.tx,ty:st.ty}; stageEl.setPointerCapture(e.pointerId); stageEl.classList.add("drag"); });
  stageEl.addEventListener("pointermove",e=>{ if(!drag) return; st.tx=drag.tx+e.clientX-drag.x; st.ty=drag.ty+e.clientY-drag.y; applyTx(); });
  const end=()=>{ drag=null; stageEl.classList.remove("drag"); };
  stageEl.addEventListener("pointerup",end); stageEl.addEventListener("pointercancel",end);
  // no wheel handler: the mouse wheel scrolls the page; zoom only through the buttons and double-click.
  // Double-click is detected here (capture phase on the map container) rather than with the native
  // dblclick event, because a single click re-renders the node under the pointer.
  let tapDown=null, lastTap=null;
  stageEl.addEventListener("pointerdown",e=>{ tapDown={x:e.clientX,y:e.clientY,skip:!!e.target.closest(".tg,.zoombar,.mini,.hint")||e.button!==0}; },true);
  stageEl.addEventListener("pointerup",e=>{
    const d=tapDown; tapDown=null; if(!d) return;
    if(d.skip||Math.hypot(e.clientX-d.x,e.clientY-d.y)>6){ lastTap=null; return; }      // toggle, zoom bar, minimap or a drag
    const now=e.timeStamp;                     // input time, unaffected by re-render work
    if(lastTap&&now-lastTap.t<350&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<12){
      lastTap=null; const r=stageEl.getBoundingClientRect();
      animateZoomTo(e.shiftKey?0.5:2, e.clientX-r.left, e.clientY-r.top);
    } else lastTap={t:now,x:e.clientX,y:e.clientY};
  },true);
}

function syncBtns(){
  document.getElementById("vTree").setAttribute("aria-pressed",st.view==="map");
  document.getElementById("vLin").setAttribute("aria-pressed",st.view==="lin");
  document.getElementById("vFx").setAttribute("aria-pressed",st.view==="fx");
  document.getElementById("flowBtn").setAttribute("aria-pressed",st.flow);
  document.getElementById("traceBtn").setAttribute("aria-pressed",st.trace);
  document.getElementById("motionBtn").setAttribute("aria-pressed",st.motion);
  document.getElementById("miniBtn").setAttribute("aria-pressed",st.mini);
  document.body.classList.toggle("motion",st.motion&&!REDUCE);
}
function render(){
  syncBtns();
  if(st.view==="lin"){ stageEl=null; miniEl=null; document.getElementById("main").innerHTML=lineage(); return; }
  if(st.view==="fx"){ stageEl=null; miniEl=null; document.getElementById("main").innerHTML=formulas(); runVisibleFx(); return; }
  if(!stageEl||!document.body.contains(stageEl)) buildShell();
  drawMap();
}
function toggle(id){
  keepAnchor(id,()=>{
    if(id===ROOT&&st.open.has(ROOT)&&st.open.size>1){ st.open=new Set(); }
    else if(id===ROOT&&st.open.size<=1){ Object.keys(byId).forEach(i=>{ if(byId[i].k!=="case"&&!byId[i].cases) st.open.add(i); }); }
    else st.open.has(id)?st.open.delete(id):st.open.add(id);
    layout();
  });
  render();
  const b=document.querySelector(`[data-tog="${id}"]`); b&&b.focus({preventScroll:true});
}
function select(id,center){ st.sel=id; ancestors(id).forEach(a=>st.open.add(a)); try{localStorage.setItem(SKEY,id)}catch(e){} st.view="map"; render(); if(center) centerOn(id); }
function setTheme(t){ document.documentElement.dataset.theme=t; try{localStorage.setItem(TKEY,t)}catch(e){} }
function toggleTheme(){ const cur=document.documentElement.dataset.theme||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");
  setTheme(cur==="dark"?"light":"dark"); }

document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){ const v=cp.dataset.copy; try{navigator.clipboard&&navigator.clipboard.writeText(v);}catch(err){}
    const old=cp.textContent; cp.textContent="copied · "+v; setTimeout(()=>{cp.textContent=old;},900); return; }
  if(e.target.closest("[data-trace]")){ st.trace=!st.trace; render(); return; }
  const t=e.target.closest("[data-tog],[data-sel],[data-go]"); if(!t) return;
  if(t.dataset.tog){ toggle(t.dataset.tog); return; }
  if(t.dataset.sel){ select(t.dataset.sel,false); return; }
  if(t.dataset.go){ select(t.dataset.go,true); }
});
document.getElementById("expAll").onclick=()=>{ Object.keys(byId).forEach(i=>{ if(!byId[i].cases) st.open.add(i); }); st.view="map"; render(); fit(); };
document.getElementById("colAll").onclick=()=>{ st.open=new Set([ROOT]); st.view="map"; render(); fit(); };
document.getElementById("vTree").onclick=()=>{st.view="map";render();};
document.getElementById("vLin").onclick=()=>{st.view="lin";render();};
document.getElementById("vFx").onclick=()=>{st.view="fx";render();};
document.getElementById("flowBtn").onclick=()=>{st.flow=!st.flow;render();};
document.getElementById("traceBtn").onclick=()=>{st.trace=!st.trace;st.view="map";render();};
document.getElementById("motionBtn").onclick=()=>{st.motion=!st.motion;render();};
document.getElementById("miniBtn").onclick=()=>{st.mini=!st.mini;render();};
document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("q").addEventListener("input",e=>{ st.q=e.target.value; const q=st.q.trim().toLowerCase();
  if(q && st.view==="map"){ Object.values(byId).forEach(n=>{ if(nodeText(n).includes(q)) ancestors(n.id).forEach(a=>st.open.add(a)); }); }
  render(); });
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.closest("input,textarea,select")){ if(e.key==="Escape") e.target.blur(); return; }
  const k=e.key;
  if(k==="/"){ e.preventDefault(); document.getElementById("q").focus(); return; }
  if(k==="t"||k==="T"){ toggleTheme(); return; }
  if(k==="r"||k==="R"){ st.trace=!st.trace; st.view="map"; render(); return; }
  if(k==="m"||k==="M"){ st.mini=!st.mini; render(); return; }
  if(k==="f"||k==="F"){ st.view="map"; render(); fit(); return; }
  if(k==="+"||k==="="){ zoomAt(1.25); return; }
  if(k==="-"||k==="_"){ zoomAt(1/1.25); return; }
  if(k==="0"){ zoomAt(1/st.k); return; }
  if(k==="Escape"){ if(st.q){ st.q=""; document.getElementById("q").value=""; render(); } else if(st.trace){ st.trace=false; render(); } }
});
let lastW=0, rzT=0;
addEventListener("resize",()=>{ if(!stageEl) return; syncMini();
  clearTimeout(rzT); rzT=setTimeout(()=>{ if(!stageEl) return; const w=stageEl.getBoundingClientRect().width;
    if(Math.abs(w-lastW)>80){ lastW=w; fit(); } },160); });
function legendHTML(){
  const all=Object.values(byId), kinds=new Set(all.map(n=>n.k));
  const K=[["system","System"],["service","Service"],["stage","Stage"],["step","Step"],["decision","Decision"],["case","Case"],["store","Data store"],["external","External"]];
  const tags=[...new Set(all.flatMap(n=>(n.ext||[]).map(e=>e.tag||"IO")))];
  let h=K.filter(k=>kinds.has(k[0])).map(k=>`<span><i class="mk ${k[0]}"></i>${k[1]}</span>`).join("");
  if(kinds.has("service")) h+=`<span><i class="bnk"></i>service boundary</span>`;
  if(all.some(n=>n.logic)) h+=`<span><span class="pill if">if</span>has if/else</span>`;
  if(tags.length) h+=`<span>${tags.map(t=>`<span class="pill call">${esc(t)}</span>`).join(" ")} external call</span>`;
  if(Object.keys(FX).length) h+=`<span><span class="pill fx">ƒ</span>formula</span>`;
  if(all.some(n=>n.warn)) h+=`<span><span class="pill w">!</span>known issue</span>`;
  return h+`<span><i class="ln in"></i>feeds the selected node</span><span><i class="ln out"></i>uses its output</span>`;
}
document.getElementById("kicker").textContent=CFG.kicker||"";
document.getElementById("ttl").textContent=CFG.title||"Service Map";
document.getElementById("lede").innerHTML=CFG.lede||"The system is on the left; services, stages and steps open to the right inside their service boundary. Decisions (diamonds) open into their cases (dashed nodes). Select any node to see what happens there, the if/else as written in code, the external calls it makes and live calculators for the formulas involved. Purple and orange lines animate where the selected node's data comes from and goes to; <b>Trace</b> dims everything but its full upstream and downstream chain.";
document.getElementById("foot").innerHTML=CFG.foot||"Each node and calculator carries a confidence tag: <b>Code</b> = read in source; <b>Docs</b> = vendor-documented behavior; <b>Doc</b> = team notes; <b>Inferred</b> or <b>Model</b> = derived, verify before quoting. Logic blocks are the code simplified with names kept, not a literal copy.";
document.getElementById("q").placeholder=CFG.find||"Find a node, data item or formula…";
document.getElementById("legend").innerHTML=legendHTML();
if(!Object.keys(FX).length) document.getElementById("vFx").hidden=true;
if(!Object.keys(D).length) document.getElementById("vLin").hidden=true;
ancestors(st.sel).forEach(a=>st.open.add(a));
render(); fit(); if(stageEl) lastW=stageEl.getBoundingClientRect().width;
</script>
